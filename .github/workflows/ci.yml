name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The service: fast, and gated on real Redis and MongoDB rather than mocks
  # for the context load test.
  service-tests:
    name: Service unit tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test the service
        run: mvn -B -pl cloudrelay-service -am verify -DskipITs

      - name: Publish the matchmaking benchmark
        if: always()
        run: |
          echo "## Matchmaking benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat cloudrelay-service/target/benchmarks/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: service-test-reports
          path: |
            cloudrelay-service/target/surefire-reports
            cloudrelay-service/target/benchmarks

  # The lakehouse: a real local Spark, real Delta tables, exactly-once and
  # compaction all measured rather than asserted in a comment.
  lakehouse-tests:
    name: Lakehouse unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test the lakehouse
        run: mvn -B -pl cloudrelay-lakehouse -am verify -DskipITs

      - name: Publish the compaction numbers
        if: always()
        run: |
          echo "## Compaction benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat cloudrelay-lakehouse/target/benchmarks/compaction.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lakehouse-test-reports
          path: |
            cloudrelay-lakehouse/target/surefire-reports
            cloudrelay-lakehouse/target/benchmarks

  # Everything that needs a real broker. Split out because it is the slow half
  # and because a Kafka failure should be legible as a Kafka failure.
  integration-tests:
    name: Integration tests (Testcontainers Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the Kafka integration suites
        run: mvn -B verify -DskipUTs=true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-reports
          path: '**/target/failsafe-reports'

  # Proves the CLI and the run script work, not just the classes. The pipeline
  # is driven from generated events through bronze, silver and gold, and the
  # row counts have to reconcile.
  pipeline-smoke:
    name: End-to-end pipeline run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate events
        run: python3 scripts/generate_events.py --sessions 500 --files 20

      - name: Run bronze, silver and gold
        run: ./scripts/lakehouse.sh run --source file

      - name: Compact, and record what it bought
        run: |
          ./scripts/lakehouse.sh compact --iterations 3 --warmups 1
          echo "## Compaction, end-to-end run" >> "$GITHUB_STEP_SUMMARY"
          cat data/lakehouse/_benchmarks/compaction.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Query gold and show the Delta history
        run: |
          ./scripts/lakehouse.sh query
          ./scripts/lakehouse.sh history

  docker-build:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    needs: [service-tests, lakehouse-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Build the service image
        run: docker build -t cloudrelay:${{ github.sha }} -f docker/Dockerfile .

      - name: Bring up the stack
        run: |
          cd docker
          docker compose up -d --build
          echo "Waiting for the cloudrelay health endpoint"
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Service is healthy"
              curl -s http://localhost:8080/actuator/health
              exit 0
            fi
            sleep 5
          done
          echo "Service failed to become healthy"
          docker compose logs cloudrelay
          exit 1

      - name: Drive a session and check the tee is on
        run: |
          set -e
          CODE=$(curl -s -X POST http://localhost:8080/api/v1/sessions \
            -H 'Content-Type: application/json' \
            -d '{"gameId":"cyberpunk-2077","playerId":"ci","displayName":"CI","region":"us-west-2"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["sessionCode"])')
          echo "created session $CODE"
          curl -sf "http://localhost:8080/api/v1/sessions/$CODE" > /dev/null
          # The health detail says whether events are actually leaving the
          # process, which is the one thing a smoke test can check cheaply.
          curl -s http://localhost:8080/actuator/health | grep -q '"tee":"kafka"'

      - name: Tear down
        if: always()
        run: cd docker && docker compose down -v

  helm-lint:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint helm/cloudrelay

      - name: Verify template rendering
        run: helm template cloudrelay helm/cloudrelay
