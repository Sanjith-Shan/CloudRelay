apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudrelay
  namespace: cloudrelay
  labels:
    app: cloudrelay
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudrelay
  template:
    metadata:
      labels:
        app: cloudrelay
        version: v1
    spec:
      containers:
        - name: cloudrelay
          image: cloudrelay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloudrelay-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
