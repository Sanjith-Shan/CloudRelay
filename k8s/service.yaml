apiVersion: v1
kind: Service
metadata:
  name: cloudrelay-svc
  namespace: cloudrelay
  labels:
    app: cloudrelay
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app: cloudrelay
  ports:
    - name: http
      port: 80
      targetPort: 8080
