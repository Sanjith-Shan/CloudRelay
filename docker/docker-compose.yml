# The whole system: the service, its datastores, the analytics tee, and the
# observability stack.
#
#   docker compose up -d --build                      service + Kafka + dashboards
#   docker compose --profile lakehouse up -d --build   ... and the Spark pipeline
#
# The pipeline is behind a profile because its image carries Spark and takes a
# few minutes to build the first time. Everything else is quick, and the
# service publishes to Kafka whether or not anything is reading it — which is
# the point of a tee.
services:
  cloudrelay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cloudrelay
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CLOUDRELAY_ANALYTICS_ENABLED=true
      - CLOUDRELAY_KAFKA_BOOTSTRAP=kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      # Deliberately not service_healthy. The tee is designed to survive a
      # broker that is missing, so making the API wait for Kafka would be
      # asserting a dependency the code does not have.
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudrelay-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: cloudrelay-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=cloudrelay
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Single node KRaft: broker and controller in one process, no ZooKeeper.
  # Two listeners because containers reach it as kafka:29092 and anything on
  # the host reaches it as localhost:9092, and a Kafka client connects to
  # whatever address the broker advertises rather than the one it was given.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cloudrelay-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # The medallion pipeline. Long lived: it keeps three streaming queries
  # running and trails the topic by a trigger interval.
  lakehouse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.lakehouse
    container_name: cloudrelay-lakehouse
    profiles: ["lakehouse"]
    environment:
      - CLOUDRELAY_KAFKA_BOOTSTRAP=kafka:29092
      - CLOUDRELAY_LAKEHOUSE_PATH=/data/lakehouse
    command: ["run", "--continuous", "--interval-seconds", "15"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - lakehouse-data:/data/lakehouse
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cloudrelay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cloudrelay
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cloudrelay-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
  kafka-data:
  lakehouse-data:
