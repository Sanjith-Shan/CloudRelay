replicaCount: 2

image:
  repository: cloudrelay
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

redis:
  host: redis-svc
  port: 6379

mongodb:
  uri: "mongodb://mongo-svc:27017/cloudrelay"

prometheus:
  enabled: true
  serviceMonitor: true
