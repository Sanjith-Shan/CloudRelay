{{- if .Values.prometheus.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cloudrelay.fullname" . }}
  labels:
    {{- include "cloudrelay.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cloudrelay.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
{{- end }}
